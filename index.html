<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Italian Interval - ร้านพิซซ่าขั้นคู่</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mali', sans-serif; user-select: none; }
        
        /* 🇮🇹 พื้นหลังลายตาราง Gingham สีแดง-ขาว สไตล์ร้านอิตาลี */
        body { 
            background-color: #fffcf4;
            background-image: 
                linear-gradient(90deg, rgba(211, 47, 47, 0.15) 50%, transparent 50%),
                linear-gradient(0deg, rgba(211, 47, 47, 0.15) 50%, transparent 50%);
            background-size: 50px 50px;
            color: #4e342e; 
            height: 100vh; height: 100dvh; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; touch-action: none;
        }

        /* 📱 กรอบร้านพิซซ่า */
        #app-container {
            width: 100%; max-width: 420px; 
            height: 100%; height: 100dvh; 
            background-color: #fdfaf6;
            background-image: radial-gradient(#e6d8ce 15%, transparent 16%), 
                              radial-gradient(#e6d8ce 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            border-radius: 35px; border: 8px solid #fff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            position: relative; 
            display: flex; flex-direction: column; align-items: center; padding: 20px 15px;
            overflow: hidden; 
        }

        /* ---------------- ส่วนหัว (Header - ป้ายไม้) ---------------- */
        .header-board {
            background: #5d4037; border: 4px solid #8d6e63; border-radius: 22px;
            width: 100%; text-align: center; padding: 12px 15px; margin-bottom: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 8px 0 #4e342e, 0 12px 18px rgba(0, 0, 0, 0.15);
            position: relative; flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .game-title {
            display: flex; flex-direction: column; align-items: flex-start;
        }
        .game-name-small {
            font-size: 0.85rem; color: #d7ccc8; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 2px;
        }
        .huge-target {
            font-size: 1.6rem; color: #ffccbc; font-weight: 900; line-height: 1.1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
        }

        .btn-pause {
            width: 42px; height: 42px; background: #fffcf4; border: 3px solid #d32f2f;
            border-radius: 12px; font-size: 1.2rem; color: #d32f2f; font-weight: 900;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 #b71c1c; transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent; flex-shrink: 0;
        }
        .btn-pause:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        /* HUD - หัวใจและคะแนน */
        .hud-info {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 5px; margin-bottom: 8px; z-index: 20;
        }
        .score-board { font-size: 1.1rem; color: #fff; font-weight: 900; background: #d32f2f; padding: 4px 15px; border-radius: 12px; box-shadow: 0 3px 0 #b71c1c;}
        .lives-board { font-size: 1.2rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); letter-spacing: 2px; background: #fff; padding: 4px 12px; border-radius: 12px; border: 2px solid #e6d8ce; }

        /* ---------------- พื้นที่เล่นเกม (Kitchen Area) ---------------- */
        .board-wrapper {
            position: relative; width: 100%; flex: 1; min-height: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(253,250,246,0.95) 100%);
            border: 6px solid #8d6e63; border-radius: 25px; border-bottom: none;
            box-shadow: inset 0 10px 20px rgba(93, 64, 55, 0.05);
            display: flex; flex-direction: column; overflow: hidden;
        }

        #gameArea {
            width: 100%; height: 100%; position: relative; overflow: hidden;
        }

        /* 👨‍🍳 SVG ตัวละครเชฟอิตาลี */
        .character-center-zone {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 5;
        }
        .chef-img { 
            width: 190px; height: 190px; 
            filter: drop-shadow(0 15px 15px rgba(93, 64, 55, 0.2));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: breathe 3s infinite alternate ease-in-out;
        }
        @keyframes breathe { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(1.02) translateY(-5px); } }
        
        .hint-bubble {
            background: #fff; border-radius: 20px; border: 3px solid #d32f2f;
            padding: 6px 15px; font-weight: 900; color: #d32f2f; font-size: 1rem;
            box-shadow: 0 6px 0 #ffcdd2; margin-bottom: 5px; text-align: center;
            animation: float 2s infinite alternate ease-in-out;
        }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* 🍕 แป้งพิซซ่าที่ร่วงลงมา */
        .falling-pizza {
            position: absolute; width: 105px; height: 105px; 
            background: #ffe0b2; /* สีแป้ง */
            border-radius: 50%;
            border: 6px solid #ffb300; /* ขอบชีส/ครัสต์ */
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 0 10px 15px rgba(0,0,0,0.2);
            transform: translateX(-50%); z-index: 10;
        }

        /* ซอสและบรรทัด 5 เส้นบนพิซซ่า */
        .pizza-sauce {
            position: absolute; width: 85%; height: 85%;
            background: #e53935; border-radius: 50%; z-index: -1;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        .mini-staff { width: 75%; height: 45px; position: relative; margin-top: -5px; z-index: 2; }
        .mini-line { width: 100%; height: 2px; background: rgba(255,255,255,0.6); position: absolute; border-radius: 2px;}
        .m-line-1 { bottom: 8px; } .m-line-2 { bottom: 16px; } .m-line-3 { bottom: 24px; } .m-line-4 { bottom: 32px; } .m-line-5 { bottom: 40px; }

        .mini-clef-svg {
            position: absolute; left: -10px; bottom: -18px; width: 40px; height: 75px; 
            pointer-events: none; opacity: 0.85; z-index: 1;
        }

        /* โน้ตเพลงเปรียบเสมือนเปปเปอโรนี */
        .mini-note {
            position: absolute; width: 14px; height: 14px; background: #fff;
            border-radius: 50%; border: 3px solid #3e2723;
            transform: rotate(-15deg); margin-left: -7px; margin-bottom: -7px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3); z-index: 5;
        }
        .mini-ledger {
            position: absolute; width: 24px; height: 3px; background: #fff; border-radius: 2px;
            left: 50%; top: 50%; transform: translate(-50%, -50%); border: 1px solid #3e2723;
        }

        /* 🔥 เตาอบด้านล่าง */
        .oven-zone {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100px;
            background: #4e342e; border-radius: 50px 50px 0 0;
            border: 6px solid #8d6e63; border-bottom: none;
            box-shadow: inset 0 -40px 50px rgba(255, 87, 34, 0.6), inset 0 0 20px #d84315;
            z-index: 15; display: flex; justify-content: center;
        }
        .oven-zone::before {
            content: '🔥'; font-size: 2.5rem; opacity: 0.8; animation: fireGlow 0.5s infinite alternate; margin-top: 20px;
        }
        @keyframes fireGlow { 0% { transform: scale(1); opacity: 0.7;} 100% { transform: scale(1.2); opacity: 1;} }

        .flash-red { animation: flashRed 0.3s; }
        @keyframes flashRed { 0% { background-color: #ffcdd2; } 100% { background-color: transparent; } }

        /* ---------------- แผงปุ่มตอบ (Italian Flag Colors) ---------------- */
        .answer-zone {
            position: absolute; bottom: 0; left: 0; width: 100%;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            padding: 20px 15px calc(20px + env(safe-area-inset-bottom)) 15px; 
            background: #fff; border-radius: 35px 35px 0 0; 
            box-shadow: 0 -10px 30px rgba(93, 64, 55, 0.15); z-index: 30;
        }

        .btn-ans { 
            padding: 15px 5px; font-size: 1.2rem; font-weight: 900; color: #fff; 
            border: none; border-radius: 18px; 
            cursor: pointer; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column; align-items: center; line-height: 1.1;
        }
        .btn-ans span { font-size: 0.75rem; color: rgba(255,255,255,0.9); font-weight: 700; margin-top: 3px;}
        .btn-ans:active { transform: translateY(6px); box-shadow: 0 0px 0 transparent !important; }
        
        /* 🇮🇹 สีปุ่มธีมอิตาลี เขียว-ขาว-แดง */
        .btn-2 { background: #43a047; box-shadow: 0 6px 0 #2e7d32; } /* เขียว */
        .btn-3 { background: #fbc02d; box-shadow: 0 6px 0 #f57f17; color:#5d4037;} /* เหลืองชีส */
        .btn-4 { background: #e53935; box-shadow: 0 6px 0 #c62828; } /* แดง */
        .btn-5 { background: #43a047; box-shadow: 0 6px 0 #2e7d32; }
        .btn-6 { background: #fbc02d; box-shadow: 0 6px 0 #f57f17; color:#5d4037;}
        .btn-7 { background: #e53935; box-shadow: 0 6px 0 #c62828; }

        .btn-ans.flash-green { filter: brightness(1.2); transform: scale(1.05); }
        .btn-ans.flash-red { background: #b71c1c !important; box-shadow: 0 6px 0 #7f0000 !important; color:#fff !important; }

        .feedback { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;}
        .feedback.show { opacity: 1; animation: popFeedback 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popFeedback { 0% { transform: translate(-50%, -30%) scale(0.5); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* ---------------- ☕ เมนูเริ่มและหยุดเกม ---------------- */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(78, 52, 46, 0.95); z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); text-align: center; padding: 20px;
        }
        .overlay-title { font-size: 2.5rem; color: #ffccbc; font-weight: 900; margin-bottom: 15px; text-shadow: 0px 4px 0px #b71c1c; line-height: 1.2;}
        
        .start-instruction-box {
            background: #fffcf4; padding: 25px 20px; 
            border-radius: 25px; width: 90%; text-align: center; margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 15px 25px rgba(0,0,0,0.3);
            border: 4px dashed #d32f2f;
        }

        .btn-action {
            padding: 16px 30px; font-size: 1.3rem; font-weight: 900; color: #fff;
            background: #d32f2f; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 8px 0 #b71c1c, 0 15px 20px rgba(0, 0, 0, 0.3); transition: all 0.15s; width: 85%; max-width: 250px; margin-bottom: 15px;
        }
        .btn-action:active { transform: translateY(8px); box-shadow: 0 0px 0 transparent; }
        
        .btn-secondary { background: #fff; color: #d32f2f; box-shadow: 0 8px 0 #e6d8ce, 0 15px 20px rgba(0, 0, 0, 0.2); font-size: 1.15rem; }

        .go-box { background: #fffcf4; padding: 30px 25px; border-radius: 35px; box-shadow: 0 10px 0 #e6d8ce, 0 20px 40px rgba(0,0,0,0.4); width: 100%; text-align: center; border: 4px dashed #d32f2f; }
        .go-box h2 { font-size: 2.2rem; color: #d32f2f; margin-bottom: 20px; font-weight: 900; }
        .result-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; background: #fff; border-radius: 20px; overflow: hidden; border: 2px dashed #bcaaa4;}
        .result-table td { padding: 15px; border-bottom: 2px dashed #bcaaa4; font-size: 1.1rem; }
        .result-table td:first-child { text-align: left; color: #5d4037; font-weight: bold; }
        .result-table td:last-child { text-align: right; font-weight: 900; color: #d32f2f; font-size: 1.5rem;}
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- ส่วนหัวบอกโจทย์ -->
        <div class="header-board">
            <div class="game-title">
                <span class="game-name-small">Pizzeria 🍕</span>
                <h1 class="huge-target" id="targetScaleText">วิเคราะห์ขั้นคู่</h1>
            </div>
            <button class="btn-pause" onclick="pauseGame()">⏸</button>
        </div>

        <!-- แถบแสดงคะแนนและหัวใจ -->
        <div class="hud-info">
            <div class="score-board">SCORE: <span id="scoreDisplay">0</span></div>
            <div class="lives-board" id="livesDisplay">❤️❤️❤️</div>
        </div>

        <!-- กระดานเล่นเกม -->
        <div class="board-wrapper" id="boardWrapper">
            <div id="gameArea">
                <!-- SVG พ่อครัวอิตาลี -->
                <div class="character-center-zone">
                    <div class="hint-bubble" id="chefBubble">Mamma Mia!</div>
                    
                    <svg class="chef-img" id="chefFace" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- เสื้อเชฟขาว -->
                        <path d="M 25 115 C 25 85, 95 85, 95 115" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
                        <!-- ผ้าพันคอสีแดง (Italian style) -->
                        <path d="M 45 95 L 60 105 L 75 95 L 60 115 Z" fill="#d32f2f"/>

                        <!-- หู -->
                        <circle cx="32" cy="65" r="7" fill="#ffccbc"/>
                        <circle cx="88" cy="65" r="7" fill="#ffccbc"/>

                        <!-- ใบหน้า -->
                        <rect x="35" y="45" width="50" height="48" rx="15" fill="#ffccbc"/>
                        
                        <!-- หมวกเชฟทรงสูง (Toque) -->
                        <path d="M 35 45 C 20 45, 20 20, 35 15 C 40 5, 60 0, 70 10 C 85 5, 100 20, 95 35 C 105 45, 95 55, 85 45 L 85 45 L 35 45 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

                        <!-- ตา -->
                        <circle id="eyeL" cx="47" cy="58" r="3" fill="#3e2723"/>
                        <circle id="eyeR" cx="73" cy="58" r="3" fill="#3e2723"/>

                        <!-- จมูกกลมโต -->
                        <ellipse cx="60" cy="65" rx="8" ry="6" fill="#ffab91"/>

                        <!-- หนวดดำโค้งเฟี้ยว (Italian Mustache) -->
                        <path id="mustache" d="M 40 70 Q 50 62 60 70 Q 70 62 80 70 Q 75 76 60 73 Q 45 76 40 70 Z" fill="#212121"/>
                    </svg>
                </div>

                <div id="feedbackText" class="feedback"></div>

                <!-- เตาอบด้านล่าง -->
                <div class="oven-zone" id="ovenZone"></div>
            </div>

            <!-- แผงปุ่มตอบ 6 ปุ่ม -->
            <div class="answer-zone">
                <button class="btn-ans btn-2" onclick="checkAnswer(2, this)">คู่ 2<br><span>(2nd)</span></button>
                <button class="btn-ans btn-3" onclick="checkAnswer(3, this)">คู่ 3<br><span>(3rd)</span></button>
                <button class="btn-ans btn-4" onclick="checkAnswer(4, this)">คู่ 4<br><span>(4th)</span></button>
                <button class="btn-ans btn-5" onclick="checkAnswer(5, this)">คู่ 5<br><span>(5th)</span></button>
                <button class="btn-ans btn-6" onclick="checkAnswer(6, this)">คู่ 6<br><span>(6th)</span></button>
                <button class="btn-ans btn-7" onclick="checkAnswer(7, this)">คู่ 7<br><span>(7th)</span></button>
            </div>
        </div>

        <!-- หน้าต่างเริ่มเกม -->
        <div id="startOverlay" class="overlay-screen" style="display: flex;">
            <h1 class="overlay-title">Interval Pizza 🍕</h1>
            <div class="start-instruction-box">
                <p style="font-size: 1.2rem; color: #d32f2f; font-weight: 900; line-height: 1.5; margin-bottom:10px;">
                    🔥 วิธีย่างพิซซ่า
                </p>
                <p style="font-size: 0.95rem; color: #4e342e; font-weight: 700;">ดูพิซซ่าที่ตกลงมา จะมีโน้ต 2 ตัว</p>
                <p style="font-size: 0.95rem; color: #4e342e; font-weight: 700;">นับระยะห่าง (ขั้นคู่) แล้วกดปุ่มตอบ</p>
                <p style="font-size: 0.85rem; color: #d32f2f; font-weight: 700; margin-top: 10px;">
                    ❤️ ตอบให้ทันก่อนพิซซ่าตกลงไปไหม้ในเตาอบนะ!
                </p>
            </div>
            <button class="btn-action" onclick="startGame()">เริ่มทำพิซซ่า ▶</button>
        </div>

        <!-- หน้าต่างหยุดเกม -->
        <div id="pauseModal" class="overlay-screen">
            <h1 class="overlay-title" style="color: #ffccbc;">พักทานเจลาโต้ 🍨</h1>
            <div style="display: flex; flex-direction: column; width:100%; align-items:center;">
                <button class="btn-action" onclick="resumeGame()">▶ เปิดเตาอบต่อ</button>
                <button class="btn-action btn-secondary" onclick="restartGame()">🔄 เริ่มนวดแป้งใหม่</button>
            </div>
        </div>

        <!-- 💀 หน้าจอจบเกมส์ -->
        <div id="gameOverScreen" class="overlay-screen">
            <div class="go-box">
                <h2>พิซซ่าไหม้หมด! 🥺</h2>
                <table class="result-table">
                    <tr><td>คะแนนรวม</td><td><span id="finalScore">0</span></td></tr>
                </table>
                <button class="btn-action" onclick="backToStartScreen()">กลับหน้าร้าน 🌸</button>
            </div>
        </div>

    </div>

    <script>
        // ---------------- 🎵 ระบบคลังเสียง ----------------
        const popSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1114/1114-preview.mp3'); 
        const errorSound = new Audio('https://assets.mixkit.co/active_storage/sfx/314/314-preview.mp3');
        const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'); 
        
        function playSound(audio) { 
            audio.currentTime = 0; audio.volume = 0.5;
            audio.play().catch(e => {}); 
        }

        // ---------------- 👨‍🍳 ระบบเปลี่ยนอารมณ์เชฟ SVG ----------------
        function setChefEmotion(emotion) {
            const mustache = document.getElementById('mustache');
            const eyeL = document.getElementById('eyeL');
            const eyeR = document.getElementById('eyeR');

            if (emotion === 'normal') {
                mustache.setAttribute('d', 'M 40 70 Q 50 62 60 70 Q 70 62 80 70 Q 75 76 60 73 Q 45 76 40 70 Z');
                eyeL.setAttribute('r', '3'); eyeR.setAttribute('r', '3');
                eyeL.setAttribute('cy', '58'); eyeR.setAttribute('cy', '58');
            } else if (emotion === 'happy') {
                mustache.setAttribute('d', 'M 40 68 Q 50 60 60 68 Q 70 60 80 68 Q 75 74 60 71 Q 45 74 40 68 Z');
                eyeL.setAttribute('r', '4'); eyeR.setAttribute('r', '4');
                eyeL.setAttribute('cy', '57'); eyeR.setAttribute('cy', '57');
            } else if (emotion === 'angry') {
                mustache.setAttribute('d', 'M 40 75 Q 50 65 60 70 Q 70 65 80 75 Q 75 75 60 75 Q 45 75 40 75 Z');
                eyeL.setAttribute('r', '3'); eyeR.setAttribute('r', '3');
            } else if (emotion === 'shocked') {
                mustache.setAttribute('d', 'M 40 65 Q 50 55 60 65 Q 70 55 80 65 Q 75 75 60 80 Q 45 75 40 65 Z');
                eyeL.setAttribute('r', '5'); eyeR.setAttribute('r', '5');
            }
        }

        // ---------------- ⚙️ ตัวแปรควบคุมเกม ----------------
        let activePizzas = [];       
        let score = 0;
        let lives = 3;
        let pizzasCleared = 0;
        
        let gameLoopId;
        let spawnId;
        
        let fallSpeed = 1.0;        
        let spawnRate = 2500;       
        let isPaused = false; 

        const gameArea = document.getElementById('gameArea');
        const boardWrapper = document.getElementById('boardWrapper');
        const ovenZone = document.getElementById('ovenZone');
        const chefFace = document.getElementById('chefFace');
        const chefBubble = document.getElementById('chefBubble');
        const feedbackText = document.getElementById('feedbackText');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');

        // ---------------- ⏸️ ระบบหยุดเกม / เริ่มใหม่ ----------------
        function pauseGame() {
            if (!activePizzas.length && score === 0 && lives === 3) return;
            playSound(popSound);
            isPaused = true;
            document.getElementById('pauseModal').style.display = 'flex';
        }

        function resumeGame() {
            playSound(popSound);
            isPaused = false;
            document.getElementById('pauseModal').style.display = 'none';
        }

        function restartGame() {
            playSound(popSound);
            document.getElementById('pauseModal').style.display = 'none';
            startGameInit();
        }

        function backToStartScreen() {
            playSound(popSound);
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startOverlay').style.display = 'flex';
        }

        function updateUI() {
            scoreDisplay.textContent = score;
            livesDisplay.textContent = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 3 - lives));
        }

        function triggerGameOver() {
            isPaused = true;
            cancelAnimationFrame(gameLoopId);
            clearInterval(spawnId);
            
            setTimeout(() => {
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }, 500);
        }

        // ---------------- 🚀 ฟังก์ชันหลักของเกม ----------------
        function startGame() {
            playSound(popSound);
            document.getElementById('startOverlay').style.display = 'none';
            startGameInit();
        }
        
        function startGameInit() {
            activePizzas.forEach(p => p.element.remove());
            activePizzas = [];
            
            score = 0;
            lives = 3;
            pizzasCleared = 0;
            fallSpeed = 1.0;
            spawnRate = 2500;
            isPaused = false;
            
            updateUI();
            setChefEmotion('normal');
            chefFace.style.transform = "scaleX(1) scale(1)";
            chefBubble.textContent = "สั่งมาเลย!";
            
            gameLoopId = requestAnimationFrame(updateGame);
            
            clearInterval(spawnId);
            spawnPizza(); // ลูกแรกมาทันที
            spawnId = setInterval(spawnPizza, spawnRate);
        }

        // สร้างพิซซ่าและสุ่มขั้นคู่ (Interval 2-7)
        function spawnPizza() {
            if (isPaused) return; 

            // สุ่มโน้ตตัวล่างสุดในบรรทัด 5 เส้น (0 = C4, 1 = D4, ... 4 = G4)
            let bottomPos = Math.floor(Math.random() * 5); 
            // สุ่มขั้นคู่ (2 ถึง 7)
            let interval = Math.floor(Math.random() * 6) + 2; 
            // โน้ตตัวบน
            let topPos = bottomPos + interval - 1; 

            const pizzaEl = document.createElement('div');
            pizzaEl.classList.add('falling-pizza');
            
            // กุญแจซอลตัวเต็มแบบ SVG และซอสมะเขือเทศ
            let html = `
                <div class="pizza-sauce"></div>
                <div class="mini-staff">
                    <svg class="mini-clef-svg" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <text x="5" y="150" font-family="'Times New Roman', Georgia, serif" font-size="140" fill="#fff">&#119070;</text>
                    </svg>
                    <div class="mini-line m-line-1"></div>
                    <div class="mini-line m-line-2"></div>
                    <div class="mini-line m-line-3"></div>
                    <div class="mini-line m-line-4"></div>
                    <div class="mini-line m-line-5"></div>
            `;
            
            // วาดโน้ต 2 ตัว (เปปเปอโรนี)
            // ระยะห่างแต่ละเส้น/ช่อง คือ 4px (เพราะ line-height ใน CSS)
            let bottomPx = 8 + (bottomPos * 4);
            let topPx = 8 + (topPos * 4);
            
            let leftPxBottom = 35;
            let leftPxTop = 35;
            
            // ถ้าเป็นคู่ 2 ต้องขยับหลบกัน (คู่ 2 โน้ตจะชิดกันมาก)
            if (interval === 2) {
                leftPxTop += 14;
            }

            let ledgerB = (bottomPos <= 0 || bottomPos >= 12) ? `<div class="mini-ledger"></div>` : '';
            let ledgerT = (topPos <= 0 || topPos >= 12) ? `<div class="mini-ledger"></div>` : '';

            html += `<div class="mini-note" style="bottom:${bottomPx}px; left:${leftPxBottom}%;">${ledgerB}</div>`;
            html += `<div class="mini-note" style="bottom:${topPx}px; left:${leftPxTop}%;">${ledgerT}</div>`;
            
            html += `</div>`;
            pizzaEl.innerHTML = html;
            
            const maxLeft = gameArea.clientWidth - 110;
            const randomX = Math.floor(Math.random() * maxLeft) + 55;
            pizzaEl.style.left = randomX + 'px';
            pizzaEl.style.top = '-110px';
            
            gameArea.appendChild(pizzaEl);
            activePizzas.push({ element: pizzaEl, type: interval, y: -110, x: randomX });
        }

        function updateGame() {
            if (!isPaused) {
                const areaHeight = gameArea.clientHeight;
                const ovenTop = areaHeight - 110; // ตำแหน่งปากเตาอบ

                for (let i = 0; i < activePizzas.length; i++) {
                    let pizzaObj = activePizzas[i];
                    pizzaObj.y += fallSpeed;
                    pizzaObj.element.style.top = pizzaObj.y + 'px';

                    // ถ้าพิซซ่าร่วงลงไปถึงเตาอบ (เลยปุ่มกด)
                    if (pizzaObj.y > ovenTop) {
                        pizzaObj.element.remove();
                        activePizzas.splice(i, 1);
                        i--;
                        
                        // พลาด! โดนไฟไหม้
                        lives--;
                        updateUI();
                        playSound(errorSound);
                        boardWrapper.classList.add('flash-red');
                        
                        setChefEmotion('shocked');
                        chefBubble.textContent = "Mama Mia! ไหม้แล้ว!";
                        
                        setTimeout(() => boardWrapper.classList.remove('flash-red'), 300);
                        
                        if (lives <= 0) {
                            triggerGameOver();
                        }
                    }
                }
            }
            
            gameLoopId = requestAnimationFrame(updateGame);
        }

        // ---------------- 🔘 ระบบตรวจคำตอบ ----------------
        function checkAnswer(answerType, btnElement) {
            if (isPaused || activePizzas.length === 0) return;
            
            // เช็คพิซซ่าที่อยู่ล่างสุด (ตัวแรกใน Array)
            let targetPizza = activePizzas[0];
            
            if (targetPizza.type === answerType) {
                // ตอบถูก!
                playSound(successSound);
                
                btnElement.classList.add('flash-green');
                setTimeout(() => btnElement.classList.remove('flash-green'), 200);
                
                targetPizza.element.style.transition = '0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                targetPizza.element.style.transform = 'translateY(-100px) scale(0) rotate(180deg)';
                targetPizza.element.style.opacity = '0';
                
                score += 50; 
                pizzasCleared++;
                updateUI();
                
                setChefEmotion('happy');
                chefBubble.textContent = "Bellissimo! 🤌";
                showFeedback("✨", "");
                
                setTimeout(() => targetPizza.element.remove(), 300);
                activePizzas.shift();

                // เพิ่มความยากทุกๆ 5 ถาด
                if (pizzasCleared % 5 === 0) {
                    fallSpeed += 0.15; 
                    spawnRate = Math.max(1000, spawnRate - 150);
                    clearInterval(spawnId);
                    spawnId = setInterval(spawnPizza, spawnRate);
                }
                
            } else {
                // ตอบผิด
                playSound(errorSound);
                
                btnElement.classList.add('flash-red');
                setTimeout(() => btnElement.classList.remove('flash-red'), 200);
                
                targetPizza.element.style.transform = 'translateX(-10px)';
                setTimeout(() => targetPizza.element.style.transform = 'translateX(10px)', 50);
                setTimeout(() => targetPizza.element.style.transform = 'translateX(-50%)', 100);
                
                lives--;
                updateUI();
                
                setChefEmotion('angry');
                chefBubble.textContent = "ดูดีๆ สิลูกพี่!";
                showFeedback("❌", "");
                
                if (lives <= 0) {
                    triggerGameOver();
                }
            }
        }

        function showFeedback(msg, color) { 
            feedbackText.textContent = msg; 
            feedbackText.classList.remove('show'); 
            void feedbackText.offsetWidth; 
            feedbackText.classList.add('show'); 
        }

    </script>
</body>
