<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cozy Sheep Dentist - เกมกดฟันแกะน้อย</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mali', sans-serif; user-select: none; }
        
        /* 🌿 พื้นหลังลายตาราง Gingham สีเขียวมิ้นต์ สไตล์ปิกนิกทุ่งหญ้า */
        body { 
            background-color: #e0f2f1;
            background-image: 
                linear-gradient(90deg, rgba(77, 182, 172, 0.15) 50%, transparent 50%),
                linear-gradient(0deg, rgba(77, 182, 172, 0.15) 50%, transparent 50%);
            background-size: 50px 50px;
            color: #4e342e; 
            height: 100vh; height: 100dvh; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; touch-action: none;
        }

        /* 📱 กรอบเกมมือถือ */
        #app-container {
            width: 100%; max-width: 420px; 
            height: 100%; height: 100dvh; 
            background-color: #fdfaf6;
            background-image: radial-gradient(#e0f2f1 15%, transparent 16%), 
                              radial-gradient(#e0f2f1 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            border-radius: 35px; border: 8px solid #fff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative; 
            display: flex; flex-direction: column; align-items: center; padding: 20px 15px;
            overflow: hidden; 
        }

        /* ---------------- ส่วนหัว (Header) ---------------- */
        .header-board {
            background: #fff; border: 4px solid #b2dfdb; border-radius: 22px;
            width: 100%; text-align: center; padding: 12px 15px; margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 8px 0 #e0f2f1;
            position: relative; flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .game-title { display: flex; flex-direction: column; align-items: flex-start; }
        .game-name-small {
            font-size: 0.85rem; color: #00796b; font-weight: 900; letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 2px;
        }
        .huge-target {
            font-size: 1.6rem; color: #ff8a65; font-weight: 900; line-height: 1.1;
            text-shadow: 1px 2px 0px #ffe0b2;
        }

        .btn-pause {
            width: 42px; height: 42px; background: #fffcf4; border: 3px solid #ff8a65;
            border-radius: 12px; font-size: 1.2rem; color: #d84315; font-weight: 900;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 #d84315; transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent; flex-shrink: 0;
        }
        .btn-pause:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        /* HUD - หัวใจและคะแนน */
        .hud-info {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 5px; margin-bottom: 10px; z-index: 20;
        }
        .score-board { font-size: 1.1rem; color: #fff; font-weight: 900; background: #4db6ac; padding: 4px 15px; border-radius: 12px; box-shadow: 0 4px 0 #00897b;}
        .lives-board { font-size: 1.2rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1)); letter-spacing: 2px; background: #fff; padding: 4px 12px; border-radius: 12px; border: 2px dashed #80cbc4; }

        /* ---------------- พื้นที่เล่นเกม (Sheep Area) ---------------- */
        .board-wrapper {
            position: relative; width: 100%; flex: 1; min-height: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(224, 242, 241, 0.9) 100%);
            border: 6px solid #b2dfdb; border-radius: 25px; 
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #gameArea {
            width: 100%; height: 100%; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 🐑 SVG น้องแกะ - ขยายขนาดให้ใหญ่ขึ้น */
        .sheep-container {
            position: relative; width: 380px; height: 380px;
            animation: floatSheep 4s infinite alternate ease-in-out;
        }
        @keyframes floatSheep { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }

        .sheep-svg { width: 100%; height: 100%; filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.15)); }

        /* การทำอนิเมชันตอนงับปาก */
        .mouth-interior { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 50% 65%; }
        .biting .mouth-interior { transform: scaleY(0.05); } 
        .biting .sheep-svg { animation: shakeHead 0.3s; }
        @keyframes shakeHead { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-10px) rotate(-3deg); } 
            75% { transform: translateX(10px) rotate(3deg); } 
        }

        /* 🎵 โจทย์ในปากแกะ */
        .question-zone {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 80px; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.1s;
        }
        .biting .question-zone { opacity: 0; }

        .mini-staff { width: 100%; height: 40px; position: relative; }
        .mini-line { width: 100%; height: 2px; background: rgba(255,255,255,0.4); position: absolute; border-radius: 2px;}
        
        /* บรรทัด 5 เส้น ระยะห่าง 10px */
        .m-line-1 { bottom: 0px; } 
        .m-line-2 { bottom: 10px; } 
        .m-line-3 { bottom: 20px; } 
        .m-line-4 { bottom: 30px; } 
        .m-line-5 { bottom: 40px; }

        /* ปรับกุญแจซอลให้อยู่ตำแหน่งที่ถูกต้อง (วงกลมม้วนรอบเส้นที่ 2) */
        .mini-clef-svg {
            position: absolute; left: 0px; bottom: -20px; width: 45px; height: 80px; 
            pointer-events: none; opacity: 0.8; z-index: 1;
        }

        /* โน้ตเพลงแบบตัวกลม (Whole Note) โปร่งใสเห็นเส้น */
        .mini-note {
            position: absolute; width: 16px; height: 10px; 
            background: transparent; border: 2.5px solid #ffffff;
            border-radius: 50%; transform: rotate(-10deg); 
            margin-left: -8px; margin-bottom: -5px; /* จัดศูนย์กลางให้ตรงเป๊ะ */
            box-shadow: 1px 1px 0 rgba(0,0,0,0.2); z-index: 5;
        }
        /* เส้นน้อย (Ledger Line) หมุนกลับให้ขนานกับบรรทัด 5 เส้น */
        .mini-ledger {
            position: absolute; width: 26px; height: 2px; background: #ffffff; border-radius: 2px;
            left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(10deg); 
        }

        /* 🦷 ปุ่มฟันแกะ */
        .teeth-zone {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 15;
            transition: opacity 0.1s, transform 0.15s;
        }
        .biting .teeth-zone { opacity: 0; transform: translate(-50%, 20px); }

        .tooth-btn {
            width: 35px; height: 50px; background: #fff; border: 2px solid #e0e0e0;
            border-radius: 6px 6px 18px 18px; /* ทรงฟันมนขึ้น */
            font-size: 1.5rem; font-weight: 900; color: #795548;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #d7ccc8, inset 0 -5px 8px rgba(0,0,0,0.05);
            transition: all 0.1s; -webkit-tap-highlight-color: transparent;
            padding-bottom: 5px;
        }
        .tooth-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent; background: #fdfaf6;}
        
        .flash-green { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #1b5e20 !important; }
        .flash-red-bg { animation: flashRedBg 0.4s; }
        @keyframes flashRedBg { 0% { background-color: #ffcdd2; } 100% { background-color: transparent; } }

        /* ---------------- ☕ เมนูเริ่มและหยุดเกม ---------------- */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(78, 52, 46, 0.85); z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(6px); text-align: center; padding: 20px;
        }
        .overlay-title { font-size: 2.6rem; color: #fff; font-weight: 900; margin-bottom: 15px; text-shadow: 0px 4px 0px #ff8a65; line-height: 1.2;}
        
        .start-instruction-box {
            background: #fffcf4; padding: 25px 20px; 
            border-radius: 25px; width: 90%; text-align: center; margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 15px 25px rgba(0,0,0,0.2);
            border: 4px dashed #4db6ac;
        }

        .btn-action {
            padding: 16px 30px; font-size: 1.3rem; font-weight: 900; color: #fff;
            background: #ff8a65; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 8px 0 #d84315, 0 15px 20px rgba(0, 0, 0, 0.2); transition: all 0.15s; width: 85%; max-width: 250px; margin-bottom: 15px;
        }
        .btn-action:active { transform: translateY(8px); box-shadow: 0 0px 0 transparent; }
        
        .btn-secondary { background: #fff; color: #00796b; box-shadow: 0 8px 0 #b2dfdb, 0 15px 20px rgba(0, 0, 0, 0.1); font-size: 1.15rem; }

        .go-box { background: #fffcf4; padding: 30px 25px; border-radius: 35px; box-shadow: 0 10px 0 #e6d8ce, 0 20px 40px rgba(0,0,0,0.4); width: 100%; text-align: center; border: 4px dashed #ff8a65; }
        .go-box h2 { font-size: 2.2rem; color: #d84315; margin-bottom: 20px; font-weight: 900; }
        .result-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; background: #fff; border-radius: 20px; overflow: hidden; border: 2px dashed #b2dfdb;}
        .result-table td { padding: 15px; border-bottom: 2px dashed #b2dfdb; font-size: 1.2rem; }
        .result-table td:first-child { text-align: left; color: #00796b; font-weight: bold; }
        .result-table td:last-child { text-align: right; font-weight: 900; color: #ff8a65; font-size: 1.6rem;}
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- ส่วนหัวบอกโจทย์ -->
        <div class="header-board">
            <div class="game-title">
                <span class="game-name-small">Sheep Dentist 🐑</span>
                <h1 class="huge-target">นับขั้นคู่ให้ถูกนะ!</h1>
            </div>
            <button class="btn-pause" onclick="pauseGame()">⏸</button>
        </div>

        <!-- แถบแสดงคะแนนและหัวใจ -->
        <div class="hud-info">
            <div class="score-board">SCORE: <span id="scoreDisplay">0</span></div>
            <div class="lives-board" id="livesDisplay">❤️❤️❤️</div>
        </div>

        <!-- กระดานเล่นเกม -->
        <div class="board-wrapper" id="boardWrapper">
            <div id="gameArea">
                
                <div class="sheep-container" id="sheepMaster">
                    <!-- SVG แกะน้อย -->
                    <svg class="sheep-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <!-- ขนแกะด้านหลัง/รอบๆ (Fluffy Wool) -->
                        <circle cx="200" cy="90" r="75" fill="#ffffff"/>
                        <circle cx="120" cy="120" r="65" fill="#ffffff"/>
                        <circle cx="280" cy="120" r="65" fill="#ffffff"/>
                        <circle cx="80" cy="190" r="60" fill="#ffffff"/>
                        <circle cx="320" cy="190" r="60" fill="#ffffff"/>
                        <circle cx="100" cy="270" r="60" fill="#ffffff"/>
                        <circle cx="300" cy="270" r="60" fill="#ffffff"/>
                        <circle cx="200" cy="300" r="70" fill="#ffffff"/>

                        <!-- หู -->
                        <path d="M 80 150 Q 30 180 60 210 Q 90 180 120 160 Z" fill="#fbe9e7"/>
                        <path d="M 320 150 Q 370 180 340 210 Q 310 180 280 160 Z" fill="#fbe9e7"/>

                        <!-- ใบหน้า (Face) -->
                        <rect x="100" y="120" width="200" height="200" rx="90" fill="#3e2723"/>

                        <!-- ปากที่เปิดกว้างสุดๆ (Mouth Interior) ที่จะถูก Animate พับลง -->
                        <g class="mouth-interior">
                            <path d="M 120 220 C 120 340, 280 340, 280 220 Z" fill="#1b100e"/>
                        </g>

                        <!-- จมูกและปากบน -->
                        <path d="M 195 190 L 205 190 L 200 198 Z" fill="#ffab91"/>
                        <path d="M 200 198 Q 190 205 180 200 M 200 198 Q 210 205 220 200" fill="none" stroke="#ffab91" stroke-width="4" stroke-linecap="round"/>

                        <!-- ตา -->
                        <circle id="eyeL" cx="160" cy="160" r="8" fill="#ffffff"/>
                        <circle id="eyeR" cx="240" cy="160" r="8" fill="#ffffff"/>

                        <!-- แก้มชมพู -->
                        <ellipse cx="130" cy="180" rx="14" ry="9" fill="#ffcdd2" opacity="0.8"/>
                        <ellipse cx="270" cy="180" rx="14" ry="9" fill="#ffcdd2" opacity="0.8"/>
                        
                        <!-- ขนปุกปุยบนหัว (Bangs) -->
                        <circle cx="200" cy="110" r="40" fill="#ffffff"/>
                        <circle cx="160" cy="120" r="30" fill="#ffffff"/>
                        <circle cx="240" cy="120" r="30" fill="#ffffff"/>
                    </svg>

                    <!-- 🎵 โจทย์ในปากแกะ (อยู่ทับ SVG) -->
                    <div class="question-zone">
                        <div class="mini-staff" id="staffContainer">
                            <svg class="mini-clef-svg" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                                <text x="5" y="145" font-family="'Times New Roman', Georgia, serif" font-size="140" fill="#fff">&#119070;</text>
                            </svg>
                            <div class="mini-line m-line-1"></div>
                            <div class="mini-line m-line-2"></div>
                            <div class="mini-line m-line-3"></div>
                            <div class="mini-line m-line-4"></div>
                            <div class="mini-line m-line-5"></div>
                            <!-- โน้ตตัวกลมจะถูกวาดลงที่นี่ผ่าน JS -->
                        </div>
                    </div>

                    <!-- 🦷 ปุ่มฟันแกะ (อยู่ทับ SVG บริเวณขอบปากล่าง) -->
                    <div class="teeth-zone">
                        <button class="tooth-btn" onclick="checkAnswer(2, this)">2</button>
                        <button class="tooth-btn" onclick="checkAnswer(3, this)">3</button>
                        <button class="tooth-btn" onclick="checkAnswer(4, this)">4</button>
                        <button class="tooth-btn" onclick="checkAnswer(5, this)">5</button>
                        <button class="tooth-btn" onclick="checkAnswer(6, this)">6</button>
                        <button class="tooth-btn" onclick="checkAnswer(7, this)">7</button>
                    </div>

                </div>

            </div>
        </div>

        <!-- หน้าต่างเริ่มเกม -->
        <div id="startOverlay" class="overlay-screen" style="display: flex;">
            <h1 class="overlay-title">Sheep Dentist 🐑</h1>
            <div class="start-instruction-box">
                <p style="font-size: 1.3rem; color: #00796b; font-weight: 900; line-height: 1.5; margin-bottom:10px;">
                    🦷 วิธีกดฟันแกะ
                </p>
                <p style="font-size: 1rem; color: #4e342e; font-weight: 700;">ดูโน้ตเพลงที่อยู่ใน <b>"ปากแกะ"</b></p>
                <p style="font-size: 1rem; color: #4e342e; font-weight: 700;">นับระยะห่าง แล้วกด <b>"ซี่ฟัน"</b> ให้ถูกต้อง</p>
                <p style="font-size: 0.9rem; color: #d32f2f; font-weight: 700; margin-top: 15px;">
                    ⚠️ ตอบผิด แกะงับนิ้ว เสียหัวใจนะ!
                </p>
            </div>
            <button class="btn-action" onclick="startGame()">แหย่นิ้วเริ่มเกม 👆</button>
        </div>

        <!-- หน้าต่างหยุดเกม -->
        <div id="pauseModal" class="overlay-screen">
            <h1 class="overlay-title" style="color: #ffe0b2;">พักกินหญ้า 🌿</h1>
            <div style="display: flex; flex-direction: column; width:100%; align-items:center;">
                <button class="btn-action" onclick="resumeGame()">▶ ลุยต่อ</button>
                <button class="btn-action btn-secondary" onclick="restartGame()">🔄 เริ่มเกมใหม่</button>
            </div>
        </div>

        <!-- 💀 หน้าจอจบเกมส์ -->
        <div id="gameOverScreen" class="overlay-screen">
            <div class="go-box">
                <h2>โดนงับนิ้วขาด! 😱</h2>
                <table class="result-table">
                    <tr><td>คะแนนของคุณ</td><td><span id="finalScore">0</span></td></tr>
                </table>
                <button class="btn-action" onclick="backToStartScreen()">กลับไปทำแผล 🩹</button>
            </div>
        </div>

    </div>

    <script>
        // ---------------- 🎵 ระบบคลังเสียง ----------------
        const popSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1114/1114-preview.mp3'); 
        const errorSound = new Audio('https://assets.mixkit.co/active_storage/sfx/314/314-preview.mp3');
        const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'); 
        
        function playSound(audio) { 
            audio.currentTime = 0; audio.volume = 0.5;
            audio.play().catch(e => {}); 
        }

        // ---------------- ⚙️ ตัวแปรควบคุมเกม ----------------
        let score = 0;
        let lives = 3;
        let currentInterval = 0;
        let isPaused = false; 
        let isBiting = false;

        const boardWrapper = document.getElementById('boardWrapper');
        const sheepMaster = document.getElementById('sheepMaster');
        const staffContainer = document.getElementById('staffContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');

        // ---------------- ⏸️ ระบบหยุดเกม / เริ่มใหม่ ----------------
        function pauseGame() {
            if (isBiting) return;
            playSound(popSound);
            isPaused = true;
            document.getElementById('pauseModal').style.display = 'flex';
        }

        function resumeGame() {
            playSound(popSound);
            isPaused = false;
            document.getElementById('pauseModal').style.display = 'none';
        }

        function restartGame() {
            playSound(popSound);
            isPaused = false;
            document.getElementById('pauseModal').style.display = 'none';
            startGameInit();
        }

        function backToStartScreen() {
            playSound(popSound);
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startOverlay').style.display = 'flex';
        }

        function updateUI() {
            scoreDisplay.textContent = score;
            livesDisplay.textContent = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 3 - lives));
        }

        function triggerGameOver() {
            isPaused = true;
            setTimeout(() => {
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }, 800);
        }

        // ---------------- 🚀 ฟังก์ชันหลักของเกม ----------------
        function startGame() {
            playSound(popSound);
            document.getElementById('startOverlay').style.display = 'none';
            startGameInit();
        }
        
        function startGameInit() {
            score = 0;
            lives = 3;
            isPaused = false;
            isBiting = false;
            updateUI();
            generateQuestion();
        }

        // สุ่มโจทย์โน้ตตัวกลมขึ้นมาไว้ในปากแกะ
        function generateQuestion() {
            const oldNotes = staffContainer.querySelectorAll('.mini-note');
            oldNotes.forEach(n => n.remove());

            // สุ่มตำแหน่งตัวล่างสุด C4(0) ถึง A4(5)
            // (ตำแหน่ง: 0=C4, 1=D4, 2=E4(เส้น1), 3=F4, 4=G4, 5=A4)
            let bottomPos = Math.floor(Math.random() * 6); 
            // สุ่มขั้นคู่ (2 ถึง 7)
            currentInterval = Math.floor(Math.random() * 6) + 2; 
            let topPos = bottomPos + currentInterval - 1; 
            
            // ระยะห่างเส้นและช่อง = 5px
            // ให้ E4 (ตำแหน่ง 2) อยู่ที่ bottom: 0px (บรรทัดเส้นที่ 1 พอดี)
            let bottomPx = (bottomPos * 5) - 10;
            let topPx = (topPos * 5) - 10;
            
            // ระยะซ้ายขวาของโน้ต จัดให้อยู่กึ่งกลาง
            let leftPxBottom = 90;
            let leftPxTop = 90;
            
            // แก้บัคขั้นคู่ 2 ทับกัน: ขยับตัวบนไปทางขวา และขยับซ้ายให้ดูสมดุล
            if (currentInterval === 2) {
                leftPxTop += 16;
                leftPxBottom -= 8;
                leftPxTop -= 8;
            }

            // สร้าง HTML โน้ตตัวล่าง (ตัวกลม)
            let bottomNoteHTML = `<div class="mini-note" style="bottom:${bottomPx}px; left:${leftPxBottom}px;">`;
            if (bottomPos <= 0 || bottomPos >= 12) bottomNoteHTML += `<div class="mini-ledger"></div>`;
            bottomNoteHTML += `</div>`;
            
            // สร้าง HTML โน้ตตัวบน (ตัวกลม)
            let topNoteHTML = `<div class="mini-note" style="bottom:${topPx}px; left:${leftPxTop}px;">`;
            if (topPos <= 0 || topPos >= 12) topNoteHTML += `<div class="mini-ledger"></div>`;
            topNoteHTML += `</div>`;

            staffContainer.innerHTML += bottomNoteHTML + topNoteHTML;
        }

        // ---------------- 🔘 ระบบตรวจคำตอบเมื่อกดฟัน ----------------
        function checkAnswer(answerType, btnElement) {
            if (isPaused || isBiting) return;
            
            if (answerType === currentInterval) {
                // ตอบถูก!
                playSound(successSound);
                score += 10;
                updateUI();
                
                btnElement.classList.add('flash-green');
                setTimeout(() => btnElement.classList.remove('flash-green'), 300);
                
                generateQuestion();
                
            } else {
                // ตอบผิด! โดนงับ
                isBiting = true;
                playSound(errorSound);
                lives--;
                updateUI();
                
                // ทำฉากหลังกระพริบแดง และสั่งงับปาก
                boardWrapper.classList.add('flash-red-bg');
                sheepMaster.classList.add('biting');
                
                // เปลี่ยนตาแกะเป็นตาโกรธ (ขีดขวาง)
                document.getElementById('eyeL').setAttribute('d', 'M 155 160 L 165 160'); 
                
                setTimeout(() => {
                    boardWrapper.classList.remove('flash-red-bg');
                    sheepMaster.classList.remove('biting');
                    isBiting = false;
                    
                    if (lives <= 0) {
                        triggerGameOver();
                    } else {
                        generateQuestion(); // สุ่มโจทย์ใหม่ให้
                    }
                }, 500); // ระยะเวลางับนิ้ว 0.5 วินาที
            }
        }

    </script>
</body>
</html>
